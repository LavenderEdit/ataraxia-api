services:
  ataraxia-api:
    build: .
    container_name: ataraxia-api-container
    ports:
      - '8081:8081'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:prod
    restart: unless-stopped
    networks:
      - portfolio_default

networks:
  portfolio_default:
    external: true
